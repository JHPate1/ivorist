<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe Test — Ivorist</title>
<meta name="description" content="Verifying NVIDIA endpoint live">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
body {
    background: #0a0e0b;
    color: #e7ece9;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
    line-height: 1.65;
    min-height: 100vh;
}
main {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px 96px;
}
.cat {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #34d399;
    font-weight: 600;
}
h1 {
    font-size: clamp(30px, 6vw, 44px);
    margin: 10px 0 14px;
    letter-spacing: -0.02em;
}
.sum {
    font-size: 18px;
    color: #a8b5ae;
    margin-bottom: 34px;
}
hr {
    border: 0;
    border-top: 1px solid #1d2722;
    margin: 30px 0;
}
p { color: #cfd9d3; margin-bottom: 18px; }
.highlights { margin: 0 0 22px; padding-left: 20px; color: #cfd9d3; }
.highlights li { margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
.chip {
    border: 1px solid #1f3a2d;
    color: #7fd6ab;
    background: #0e1613;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
}
footer {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid #1d2722;
    color: #79857e;
    font-size: 13px;
}
footer a { color: #34d399; text-decoration: none; }
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
    <div class="cat">Software</div>
    <h1>Probe Test</h1>
    <p class="sum">Verifying NVIDIA endpoint live</p>
    <hr>
    <p>Verifying NVIDIA endpoint live</p>
    <footer>Part of the <a href="https://ivorists.com/">Ivorist</a> project index.</footer>
</main>
</body>
</html>
