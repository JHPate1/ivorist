<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strova · Ivorist</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #0a0e0b;
    color: #e7ece9;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.card {
    max-width: 640px;
    width: 100%;
    background: #111714;
    border: 1px solid #1f2d26;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #34d399;
    background: #0b2319;
    border: 1px solid #1a4231;
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 16px;
}
h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
}
p {
    color: #9cb1a6;
    font-size: 16px;
    margin-bottom: 24px;
}
.url-box {
    background: #0a0e0b;
    border: 1px solid #1d2722;
    border-radius: 8px;
    padding: 12px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    color: #6ee7b7;
    margin-bottom: 24px;
    word-break: break-all;
}
footer {
    border-top: 1px solid #1d2722;
    padding-top: 16px;
    color: #67786f;
    font-size: 13px;
}
footer a { color: #34d399; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
    <span class="badge">Live Web App</span>
    <h1>Strova</h1>
    <p>Welcome to your new web application on Ivorist.</p>
    <div class="url-box">https://strova.ivorists.com</div>
    <footer>Deployed automatically via <a href="https://ivorists.com">Ivorist Ops</a>.</footer>
</div>
</body>
</html>
